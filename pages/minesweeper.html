<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>扫雷</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.geekzu.org/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <style>
        :root {
            --color-white: #ffffff;
            --color-dark: #3E3F4F;
            --color-accent: #3E3393;
            --color-accent-light: #5A4DB8;

            --color-dark-90: rgba(62, 63, 79, 0.9);
            --color-dark-80: rgba(62, 63, 79, 0.8);
            --color-dark-60: rgba(62, 63, 79, 0.6);
            --color-dark-40: rgba(62, 63, 79, 0.4);
            --color-dark-20: rgba(62, 63, 79, 0.2);
            --color-dark-12: rgba(62, 63, 79, 0.12);
            --color-dark-08: rgba(62, 63, 79, 0.08);
            --color-dark-06: rgba(62, 63, 79, 0.06);
            --color-dark-04: rgba(62, 63, 79, 0.04);

            --color-accent-25: rgba(61, 51, 147, 0.25);
            --color-accent-15: rgba(61, 51, 147, 0.15);
            --color-accent-10: rgba(61, 51, 147, 0.10);
            --color-bg-light: #F7F7F9;
            --color-bg-grid: rgba(62, 63, 79, 0.03);

            --rect-radius: 0px;
            --font-main: 'Urbanist', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

            --nav-height: 60px;
            --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
            --shadow-sm: 0 1px 2px var(--color-dark-04);
            --shadow-md: 0 4px 12px var(--color-dark-06);
            --shadow-lg: 0 8px 24px var(--color-dark-08);
            --shadow-xl: 0 16px 48px var(--color-dark-12);

            --cell-size: 36px;
            --cell-gap: 1px;
        }

        [theme="dark"] {
            --color-white: #1E1E26;
            --color-dark: #F5F5F7;
            --color-accent: #7A6FFF;
            --color-accent-light: #9B91FF;
            --color-bg-light: #121216;
            --color-bg-grid: rgba(255, 255, 255, 0.02);
            --color-dark-04: rgba(255, 255, 255, 0.04);
            --color-dark-06: rgba(255, 255, 255, 0.06);
            --color-dark-08: rgba(255, 255, 255, 0.08);
            --color-dark-12: rgba(255, 255, 255, 0.12);
            --color-dark-20: rgba(255, 255, 255, 0.2);
            --color-dark-40: rgba(255, 255, 255, 0.4);
            --color-dark-60: rgba(255, 255, 255, 0.6);
            --color-dark-80: rgba(255, 255, 255, 0.8);
            --color-dark-90: rgba(255, 255, 255, 0.9);
            --color-accent-25: rgba(122, 111, 255, 0.25);
            --color-accent-15: rgba(122, 111, 255, 0.15);
            --color-accent-10: rgba(122, 111, 255, 0.10);
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
            --shadow-xl: 0 16px 48px rgba(0,0,0,0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html {
            scroll-behavior: smooth;
            color-scheme: light dark;
            touch-action: manipulation;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--color-white);
            color: var(--color-dark);
            line-height: 1.6;
            padding-top: var(--nav-height);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        ::selection {
            background-color: var(--color-accent-25);
            color: var(--color-dark);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--color-dark-20); border-radius: 0; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-dark-40); }

        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--nav-height);
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
            border-bottom: 1px solid var(--color-dark-08);
            z-index: 1000;
            transition: box-shadow 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
        }

        [theme="dark"] .navbar {
            background-color: rgba(30, 30, 38, 0.85);
            border-bottom-color: rgba(255, 255, 255, 0.08);
        }

        .navbar-inner {
            max-width: 1200px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .navbar-brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--color-dark);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: 1px solid var(--color-dark-12);
            background: transparent;
            color: var(--color-dark-80);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .theme-btn:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
            background: var(--color-accent-10);
        }

        .theme-btn .material-icons {
            font-size: 18px;
            transition: transform 0.4s var(--transition-smooth);
        }

        .theme-btn:active .material-icons {
            transform: rotate(180deg) scale(0.8);
        }

        .game-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 24px 60px;
        }

        .section-header {
            margin-bottom: 24px;
            border-bottom: 2px solid var(--color-dark);
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 12px;
        }

        .section-title {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .section-desc {
            font-size: 0.95rem;
            color: var(--color-dark-60);
            margin-top: 4px;
        }

        .mode-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 8px 20px;
            font-family: var(--font-main);
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid var(--color-dark-12);
            background: var(--color-white);
            color: var(--color-dark-60);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .mode-btn:hover {
            border-color: var(--color-dark-40);
            color: var(--color-dark);
        }

        .mode-btn.active {
            background: var(--color-dark);
            color: var(--color-white);
            border-color: var(--color-dark);
        }

        .mode-btn .material-icons {
            font-size: 16px;
            vertical-align: text-bottom;
            margin-right: 4px;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding: 12px 16px;
            background: var(--color-bg-light);
            border: 1px solid var(--color-dark-12);
            flex-wrap: wrap;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--color-dark-80);
        }

        .info-item .material-icons {
            font-size: 18px;
            color: var(--color-accent);
        }

        .info-item span[data-value] {
            font-variant-numeric: tabular-nums;
            min-width: 60px;
            display: inline-block;
        }

        .reset-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-family: var(--font-main);
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid var(--color-dark);
            background: var(--color-dark);
            color: var(--color-white);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            background: var(--color-accent);
            border-color: var(--color-accent);
        }

        .reset-btn:active {
            transform: scale(0.96);
        }

        .board-wrap {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 4px;
            -webkit-overflow-scrolling: touch;
            text-align: center;
            white-space: nowrap;
        }

        .board-wrap::-webkit-scrollbar { height: 4px; }
        .board-wrap::-webkit-scrollbar-thumb { background: var(--color-dark-20); }

        .board {
            display: inline-grid;
            gap: var(--cell-gap);
            background: var(--color-dark-12);
            border: 2px solid var(--color-dark-20);
            padding: 2px;
            touch-action: none;
            vertical-align: top;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background: var(--color-white);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-main);
            font-size: calc(var(--cell-size) * 0.5);
            font-weight: 800;
            cursor: pointer;
            color: var(--color-dark);
            position: relative;
            transition: background 0.1s ease, transform 0.05s ease;
            -webkit-touch-callout: none;
        }

        .cell:active:not(.revealed):not(.flagged) {
            transform: scale(0.92);
        }

        .cell.revealed {
            background: var(--color-bg-light);
            cursor: default;
            box-shadow: inset 0 0 0 1px var(--color-dark-06);
        }

        .cell.mine {
            background: #C62828;
            color: #fff;
        }

        .cell.mine.revealed {
            background: #C62828;
        }

        .cell.flagged {
            background: var(--color-accent-10);
            color: var(--color-accent);
        }

        .cell.flagged::after {
            content: 'flag';
            font-family: 'Material Icons';
            font-size: calc(var(--cell-size) * 0.55);
        }

        .cell.question {
            background: var(--color-dark-06);
            color: var(--color-dark-40);
        }

        .cell.question::after {
            content: 'help_outline';
            font-family: 'Material Icons';
            font-size: calc(var(--cell-size) * 0.5);
        }

        .cell.exploded {
            background: #C62828;
            color: #fff;
            animation: explodePulse 0.4s ease;
        }

        .cell.wrong-flag {
            background: #C62828;
            color: #fff;
        }

        .cell.wrong-flag::after {
            content: 'close';
            font-family: 'Material Icons';
            font-size: calc(var(--cell-size) * 0.55);
        }

        @keyframes explodePulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .cell[data-num="1"] { color: #1976D2; }
        .cell[data-num="2"] { color: #388E3C; }
        .cell[data-num="3"] { color: #D32F2F; }
        .cell[data-num="4"] { color: #7B1FA2; }
        .cell[data-num="5"] { color: #F57C00; }
        .cell[data-num="6"] { color: #00838F; }
        .cell[data-num="7"] { color: #3E3F4F; }
        .cell[data-num="8"] { color: #757575; }

        [theme="dark"] .cell[data-num="1"] { color: #64B5F6; }
        [theme="dark"] .cell[data-num="2"] { color: #81C784; }
        [theme="dark"] .cell[data-num="3"] { color: #E57373; }
        [theme="dark"] .cell[data-num="4"] { color: #BA68C8; }
        [theme="dark"] .cell[data-num="7"] { color: #E0E0E0; }

        .cell .long-press-ring {
            position: absolute;
            inset: 0;
            border: 2px solid var(--color-accent);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s;
        }

        .cell.pressing .long-press-ring {
            opacity: 1;
            animation: ringExpand 0.5s linear forwards;
        }

        @keyframes ringExpand {
            from { transform: scale(0.8); opacity: 0.8; }
            to { transform: scale(1.2); opacity: 0; }
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(62, 63, 79, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        [theme="dark"] .modal-overlay { background-color: rgba(0, 0, 0, 0.6); }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--color-white);
            border: 2px solid var(--color-dark);
            width: 90%;
            max-width: 360px;
            padding: 28px;
            box-shadow: 12px 12px 0px var(--color-dark-20);
            transform: translateY(20px);
            transition: transform 0.3s var(--transition-smooth);
            text-align: center;
        }

        .modal-overlay.open .modal { transform: translateY(0); }

        .modal-icon {
            font-size: 48px;
            margin-bottom: 12px;
            color: var(--color-accent);
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .modal-body {
            font-size: 0.9rem;
            color: var(--color-dark-80);
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .modal-footer {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .modal-btn {
            padding: 10px 24px;
            font-family: var(--font-main);
            font-size: 0.9rem;
            font-weight: 700;
            border: 1px solid var(--color-dark);
            background: var(--color-white);
            color: var(--color-dark);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-btn:hover {
            background: var(--color-dark);
            color: var(--color-white);
        }

        .modal-btn.primary {
            background: var(--color-accent);
            border-color: var(--color-accent);
            color: var(--color-white);
        }

        .modal-btn.primary:hover {
            background: var(--color-dark);
            border-color: var(--color-dark);
        }

        .hint-bar {
            margin-top: 16px;
            padding: 10px 14px;
            background: var(--color-bg-light);
            border-left: 4px solid var(--color-accent);
            font-size: 0.8rem;
            color: var(--color-dark-60);
            line-height: 1.5;
        }

        .hint-bar .material-icons {
            font-size: 14px;
            vertical-align: text-bottom;
            margin-right: 4px;
            color: var(--color-accent);
        }

        .footer {
            text-align: center;
            padding: 40px 24px;
            border-top: 1px solid var(--color-dark-08);
            color: var(--color-dark-40);
            font-size: 0.85rem;
            margin-top: 40px;
        }

        .footer a {
            color: var(--color-accent);
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .game-container { padding: 16px 8px 40px; }
            .section-title { font-size: 1.4rem; }
            :root { --cell-size: 34px; }
            .mode-btn { padding: 8px 14px; font-size: 0.8rem; }
            .info-bar { padding: 10px 12px; }
            .info-item { font-size: 0.8rem; }
            .info-item span[data-value] { min-width: 50px; }
        }

        @media (max-width: 480px) {
            :root { --cell-size: 32px; }
            .navbar-inner { padding: 0 16px; }
            .mode-bar { gap: 6px; }
            .mode-btn { flex: 1; justify-content: center; padding: 8px 0; }
        }

        @media (max-width: 360px) {
            :root { --cell-size: 28px; }
            .info-item span[data-value] { min-width: 40px; }
        }

        :focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
        }
    </style>

<body theme="light">

    <header class="navbar">
        <div class="navbar-inner">

            </div>

            <button class="mode-btn active" data-mode="normal" onclick="game.setMode('normal')">
                <span class="material-icons">sentiment_satisfied</span>普通
            </button>
            <button class="mode-btn" data-mode="expert" onclick="game.setMode('expert')">
                <span class="material-icons">psychology</span>专家
            </button>
            <button class="mode-btn" data-mode="master" onclick="game.setMode('master')">
                <span class="material-icons">local_fire_department</span>大师
            </button>
        </div>

        <div class="info-bar">
            <div class="info-item">
                <span class="material-icons">flag</span>

        <div class="board-wrap">

        <div class="hint-bar">

        </div>
    </main>

    <footer class="footer">
        <p> 2026 Anming_cat · 使用 <a href="../index.html">桉的个人网页</a> 构建</p>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-icon" id="modal-icon">
                <span class="material-icons" style="font-size: 48px;">emoji_events</span>
            </div>
            <div class="modal-title" id="modal-title">游戏胜利</div>

        </div>
    </div>

        const themeBtn = document.getElementById('theme-switcher');
        const themeIcon = document.getElementById('theme-icon');
        const body = document.body;

        function getPreferredTheme() {
            const saved = localStorage.getItem('anming-theme');
            if (saved) return saved;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            body.setAttribute('theme', theme);
            themeIcon.textContent = theme === 'dark' ? 'light_mode' : 'dark_mode';
            localStorage.setItem('anming-theme', theme);
        }

        applyTheme(getPreferredTheme());

        themeBtn.addEventListener('click', () => {
            const current = body.getAttribute('theme');
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });

        // ==================== 音频系统（健壮版） ====================

        const ZIP_URL = '../assets/minesweeper.zip';
        const CACHE_NAME = 'minesweeper-audio-v1';

        async function loadZipBuffer(url) {
            // 1. 尝试从 Cache API 读取
            if ('caches' in window) {
                try {
                    const cache = await caches.open(CACHE_NAME);
                    let cached = await cache.match(url);
                    if (cached && cached.ok) {
                        console.log('[音频] 从 Cache API 读取缓存');
                        return await cached.arrayBuffer();
                    }
                } catch (e) {
                    console.warn('[音频] Cache API 读取失败:', e.message);
                }
            }

            // 2. 网络下载
            console.log('[音频] 从网络下载:', url);
            const resp = await fetch(url);
            if (!resp.ok) {
                throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
            }
            const buffer = await resp.arrayBuffer();

            // 3. 写入 Cache API
            if ('caches' in window) {
                try {
                    const cache = await caches.open(CACHE_NAME);
                    await cache.put(url, new Response(buffer.slice(0), {
                        headers: { 'Content-Type': 'application/zip' }
                    }));
                    console.log('[音频] 已写入 Cache API');
                } catch (e) {
                    console.warn('[音频] Cache API 写入失败:', e.message);
                }
            }

            return buffer;
        }

        const files = {

            '点到空格子': '点到空格子.ogg',
            '点到数字': '点到数字.ogg',
            '点到炸弹': '点到炸弹.ogg',
            '首次点击': '首次点击.ogg',
            '标记': '标记.ogg'
        };

                let loaded = 0;
                for (const [key, filename] of Object.entries(files)) {
                    const file = zip.file(filename);
                    if (!file) {
                        console.warn('[音频] zip 中未找到:', filename);
                        continue;
                    }
                    const ab = await file.async('arraybuffer');
                    const blob = new Blob([ab], { type: 'audio/ogg' });
                    AUDIO_CACHE[key] = URL.createObjectURL(blob);
                    loaded++;
                }

                if (loaded > 0) {
                    audioReady = true;
                    console.log(`[音频] 加载完成: ${loaded}/${Object.keys(files).length}`);
                } else {
                    console.error('[音频] 没有加载到任何音效文件');
                }
            } catch (e) {
                console.error('[音频] 初始化失败:', e.message);
            }
        }

        function unlockAudio() {
            if (audioUnlocked) return;
            audioUnlocked = true;
            // 播放一个空音频来解锁浏览器的音频策略
            const silent = new Audio();
            silent.volume = 0;
            silent.play().catch(() => {});
        }

        function playSound(name) {
            if (!audioReady || !AUDIO_CACHE[name]) {
                console.log('[音频] 跳过播放:', name, 'ready=', audioReady, 'cached=', !!AUDIO_CACHE[name]);
                return;
            }
            try {
                const audio = new Audio(AUDIO_CACHE[name]);
                audio.volume = 0.7;
                audio.play().catch(err => {
                    console.warn('[音频] 播放失败:', name, err.message);
                });
            } catch (e) {
                console.warn('[音频] 创建 Audio 失败:', e.message);
            }
        }

        // 页面加载后初始化音频
        initAudio();

        // ==================== 最佳记录 ====================
        function getBestTime(mode) {
            const val = localStorage.getItem(`minesweeper-best-${mode}`);
            return val ? parseFloat(val) : null;
        }

        function setBestTime(mode, time) {
            const current = getBestTime(mode);
            if (current === null || time < current) {
                localStorage.setItem(`minesweeper-best-${mode}`, time.toFixed(2));
                return true;
            }
            return false;
        }

        function formatBestTime(time) {
            if (time === null) return '--';
            const secs = Math.floor(time);
            const cents = Math.floor((time - secs) * 100);
            return `${String(secs).padStart(3, '0')}.${String(cents).padStart(2, '0')}`;
        }

        // ==================== 扫雷游戏 ====================
        class MineSweeper {
            constructor() {
                this.modes = {
                    normal: { rows: 9, cols: 9, mines: 10, name: '普通' },
                    expert: { rows: 16, cols: 16, mines: 40, name: '专家' },
                    master: { rows: 16, cols: 30, mines: 99, name: '大师' }
                };
                this.mode = 'normal';
                this.board = [];
                this.revealed = 0;
                this.flagged = 0;
                this.gameOver = false;
                this.firstClick = true;
                this.timer = 0;
                this.startTime = 0;
                this.timerInterval = null;
                this.longPressTimer = null;
                this.longPressTarget = null;
                this.isTouch = false;
                this.touchClearTimer = null;

                this.dom = {
                    board: document.getElementById('board'),
                    mineCount: document.getElementById('mine-count'),
                    timer: document.getElementById('timer'),
                    bestTime: document.getElementById('best-time'),
                    faceIcon: document.getElementById('face-icon'),
                    modal: document.getElementById('modal'),
                    modalTitle: document.getElementById('modal-title'),
                    modalBody: document.getElementById('modal-body'),
                    modalIcon: document.getElementById('modal-icon')
                };

                this.init();
            }

            init() {
                this.reset();
                this.setupKeyboard();
                this.preventContextMenu();
            }

            setMode(mode) {
                this.mode = mode;
                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.mode === mode);
                });
                this.reset();
            }

            reset() {
                this.stopTimer();
                this.timer = 0;
                this.startTime = 0;
                this.revealed = 0;
                this.flagged = 0;
                this.gameOver = false;
                this.firstClick = true;
                this.board = [];
                this.dom.timer.textContent = '000.00';
                this.dom.faceIcon.textContent = 'sentiment_satisfied';
                this.dom.bestTime.textContent = formatBestTime(getBestTime(this.mode));
                this.updateMineCount();
                this.generateBoard();
                this.render();
            }

            generateBoard() {
                const { rows, cols } = this.modes[this.mode];
                this.board = [];
                for (let r = 0; r < rows; r++) {
                    const row = [];
                    for (let c = 0; c < cols; c++) {
                        row.push({
                            r, c,
                            mine: false,
                            revealed: false,
                            flagged: false,
                            questioned: false,
                            adjacent: 0
                        });
                    }
                    this.board.push(row);
                }
            }

            placeMines(excludeR, excludeC) {
                const { rows, cols, mines } = this.modes[this.mode];
                const excluded = new Set();

                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = excludeR + dr, nc = excludeC + dc;
                        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                            excluded.add(`${nr},${nc}`);
                        }
                    }
                }

                let placed = 0;
                while (placed < mines) {
                    const r = Math.floor(Math.random() * rows);
                    const c = Math.floor(Math.random() * cols);
                    const key = `${r},${c}`;
                    if (excluded.has(key) || this.board[r][c].mine) continue;
                    this.board[r][c].mine = true;
                    placed++;
                }

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (this.board[r][c].mine) continue;
                        this.board[r][c].adjacent = this.countAdjacentMines(r, c);
                    }
                }
            }

            countAdjacentMines(r, c) {
                const { rows, cols } = this.modes[this.mode];
                let count = 0;
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && this.board[nr][nc].mine) {
                            count++;
                        }
                    }
                }
                return count;
            }

            render() {
                const { rows, cols } = this.modes[this.mode];
                this.dom.board.style.gridTemplateColumns = `repeat(${cols}, var(--cell-size))`;
                this.dom.board.innerHTML = '';

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const cell = this.board[r][c];
                        const el = document.createElement('div');
                        el.className = 'cell';
                        el.dataset.r = r;
                        el.dataset.c = c;

                        const ring = document.createElement('div');
                        ring.className = 'long-press-ring';
                        el.appendChild(ring);

                        if (cell.revealed) {
                            el.classList.add('revealed');
                            if (cell.mine) {
                                el.classList.add('mine');
                                el.innerHTML = '<span class="material-icons" style="font-size:calc(var(--cell-size)*0.55)">dangerous</span>';
                            } else if (cell.wrong) {
                                el.classList.add('wrong-flag');
                            } else if (cell.adjacent > 0) {
                                el.textContent = cell.adjacent;
                                el.dataset.num = cell.adjacent;
                            }
                        } else if (cell.flagged) {
                            el.classList.add('flagged');
                        } else if (cell.questioned) {
                            el.classList.add('question');
                        }

                        this.bindCellEvents(el, r, c);
                        this.dom.board.appendChild(el);
                    }
                }
            }

            bindCellEvents(el, r, c) {
                // 鼠标事件（桌面端）
                el.addEventListener('mousedown', (e) => {
                    if (e.button !== 0 || this.gameOver) return;
                    if (this.isTouch) return; // 忽略触摸后的幽灵点击
                    if (this.longPressTimer) clearTimeout(this.longPressTimer);
                    this.longPressTarget = el;
                    el.classList.add('pressing');
                    this.longPressTimer = setTimeout(() => {
                        el.classList.remove('pressing');
                        this.toggleFlag(r, c);
                        this.longPressTarget = null;
                        if (navigator.vibrate) navigator.vibrate(20);
                    }, 500);
                });

                el.addEventListener('mouseup', (e) => {
                    if (e.button !== 0 || this.gameOver) return;
                    if (this.isTouch) return; // 忽略触摸后的幽灵点击
                    if (this.longPressTimer) {
                        clearTimeout(this.longPressTimer);
                        this.longPressTimer = null;
                    }
                    if (this.longPressTarget === el) {
                        el.classList.remove('pressing');
                        this.longPressTarget = null;
                        this.reveal(r, c);
                    }
                });

                el.addEventListener('mouseleave', () => {
                    if (this.longPressTarget === el) {
                        clearTimeout(this.longPressTimer);
                        this.longPressTimer = null;
                        el.classList.remove('pressing');
                        this.longPressTarget = null;
                    }
                });

                // 触摸事件（移动端）
                el.addEventListener('touchstart', (e) => {
                    if (this.gameOver) return;
                    this.isTouch = true;
                    if (this.touchClearTimer) clearTimeout(this.touchClearTimer);
                    if (this.longPressTimer) clearTimeout(this.longPressTimer);
                    this.longPressTarget = el;
                    el.classList.add('pressing');
                    this.longPressTimer = setTimeout(() => {
                        el.classList.remove('pressing');
                        this.toggleFlag(r, c);
                        this.longPressTarget = null;
                        if (navigator.vibrate) navigator.vibrate(20);
                    }, 500);
                }, { passive: true });

                el.addEventListener('touchend', (e) => {
                    if (this.gameOver) return;
                    if (this.longPressTimer) {
                        clearTimeout(this.longPressTimer);
                        this.longPressTimer = null;
                    }
                    if (this.longPressTarget === el) {
                        el.classList.remove('pressing');
                        this.longPressTarget = null;
                        this.reveal(r, c);
                    }
                    // 延迟清除 isTouch，屏蔽随后的幽灵 mouse 事件
                    this.touchClearTimer = setTimeout(() => {
                        this.isTouch = false;
                    }, 400);
                });

                el.addEventListener('touchmove', () => {
                    if (this.longPressTarget === el) {
                        clearTimeout(this.longPressTimer);
                        this.longPressTimer = null;
                        el.classList.remove('pressing');
                        this.longPressTarget = null;
                    }
                });

                // 右键/长按菜单
                el.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    if (this.gameOver) return;
                    if (this.isTouch) return; // 移动端由 touch 长按处理，避免重复
                    this.toggleFlag(r, c);
                });

                // 双击快速揭开（仅桌面端）
                el.addEventListener('dblclick', () => {
                    if (this.gameOver || this.isTouch) return;
                    if (this.board[r][c].revealed && this.board[r][c].adjacent > 0) {
                        this.chordReveal(r, c);
                    }
                });
            }

            reveal(r, c) {
                const cell = this.board[r][c];
                if (cell.revealed || cell.flagged) return;

                unlockAudio();

                if (this.firstClick) {
                    this.firstClick = false;
                    this.placeMines(r, c);
                    this.startTimer();
                    playSound('首次点击');
                }

                if (cell.mine) {
                    this.gameOver = true;
                    cell.revealed = true;
                    this.stopTimer();
                    this.dom.faceIcon.textContent = 'sentiment_very_dissatisfied';
                    playSound('点到炸弹');
                    this.revealAllMines();
                    this.render();
                    setTimeout(() => this.showModal(false), 400);
                    return;
                }

                this.floodReveal(r, c);
                this.render();

                if (!this.firstClick) {
                    if (cell.adjacent === 0) {
                        playSound('点到空格子');
                    } else {
                        playSound('点到数字');
                    }
                }

                const { rows, cols, mines } = this.modes[this.mode];
                if (this.revealed === rows * cols - mines) {
                    this.gameOver = true;
                    this.stopTimer();
                    this.dom.faceIcon.textContent = 'emoji_events';
                    playSound('成功');
                    const isNew = setBestTime(this.mode, this.timer);
                    this.showModal(true, isNew);
                }
            }

            floodReveal(r, c) {
                const { rows, cols } = this.modes[this.mode];
                const queue = [[r, c]];
                const visited = new Set([`${r},${c}`]);

                while (queue.length > 0) {
                    const [cr, cc] = queue.shift();
                    const cell = this.board[cr][cc];
                    if (cell.revealed || cell.flagged) continue;

                    cell.revealed = true;
                    this.revealed++;

                    if (cell.adjacent === 0) {
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                const nr = cr + dr, nc = cc + dc;
                                const key = `${nr},${nc}`;
                                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && !visited.has(key)) {
                                    visited.add(key);
                                    queue.push([nr, nc]);
                                }
                            }
                        }
                    }
                }
            }

            chordReveal(r, c) {
                const cell = this.board[r][c];
                if (!cell.revealed || cell.adjacent === 0) return;

                const { rows, cols } = this.modes[this.mode];
                let flaggedCount = 0;
                const neighbors = [];

                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                            neighbors.push([nr, nc]);
                            if (this.board[nr][nc].flagged) flaggedCount++;
                        }
                    }
                }

                if (flaggedCount === cell.adjacent) {
                    for (const [nr, nc] of neighbors) {
                        const nCell = this.board[nr][nc];
                        if (!nCell.revealed && !nCell.flagged) {
                            if (nCell.mine) {
                                this.gameOver = true;
                                this.stopTimer();
                                this.dom.faceIcon.textContent = 'sentiment_very_dissatisfied';
                                playSound('点到炸弹');
                                this.revealAllMines();
                                this.render();
                                setTimeout(() => this.showModal(false), 400);
                                return;
                            }
                            this.floodReveal(nr, nc);
                        }
                    }
                    this.render();
                    const { rows: R, cols: C, mines } = this.modes[this.mode];
                    if (this.revealed === R * C - mines) {
                        this.gameOver = true;
                        this.stopTimer();
                        this.dom.faceIcon.textContent = 'emoji_events';
                        playSound('成功');
                        const isNew = setBestTime(this.mode, this.timer);
                        this.showModal(true, isNew);
                    }
                }
            }

            toggleFlag(r, c) {
                const cell = this.board[r][c];
                if (cell.revealed) return;

                if (cell.flagged) {
                    cell.flagged = false;
                    cell.questioned = true;
                    this.flagged--;
                } else if (cell.questioned) {
                    cell.questioned = false;
                } else {
                    cell.flagged = true;
                    this.flagged++;
                }
                playSound('标记');
                this.updateMineCount();
                this.render();
            }

            revealAllMines() {
                const { rows, cols } = this.modes[this.mode];
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const cell = this.board[r][c];
                        if (cell.mine && !cell.flagged) {
                            cell.revealed = true;
                        }
                        if (!cell.mine && cell.flagged) {
                            cell.revealed = true;
                            cell.wrong = true;
                        }
                    }
                }
            }

            updateMineCount() {
                const remaining = this.modes[this.mode].mines - this.flagged;
                this.dom.mineCount.textContent = remaining;
            }

            startTimer() {
                this.stopTimer();
                this.startTime = performance.now();
                this.timerInterval = setInterval(() => {
                    const elapsed = (performance.now() - this.startTime) / 1000;
                    this.timer = elapsed;
                    const secs = Math.floor(elapsed);
                    const cents = Math.floor((elapsed - secs) * 100);
                    this.dom.timer.textContent =
                        `${String(secs).padStart(3, '0')}.${String(cents).padStart(2, '0')}`;
                }, 30);
            }

            stopTimer() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
            }

            showModal(win, isNewRecord = false) {
                if (win) {
                    this.dom.modalIcon.innerHTML = '<span class="material-icons" style="font-size:48px; color:#2E7D32">emoji_events</span>';
                    this.dom.modalTitle.textContent = isNewRecord ? '新纪录！' : '游戏胜利';
                    const recordText = isNewRecord
                        ? `打破了 <strong>${this.modeName()}</strong> 模式的最佳纪录！`
                        : `你在 <strong>${this.modeName()}</strong> 模式中用时 <strong>${this.formatTime()}</strong>`;
                    const best = getBestTime(this.mode);
                    this.dom.modalBody.innerHTML = `${recordText}<br>当前最佳: <strong>${formatBestTime(best)}</strong>`;
                    this.dom.bestTime.textContent = formatBestTime(best);
                } else {
                    this.dom.modalIcon.innerHTML = '<span class="material-icons" style="font-size:48px; color:#C62828">error_outline</span>';
                    this.dom.modalTitle.textContent = '游戏结束';
                    this.dom.modalBody.innerHTML = `你踩到了地雷。<br>本次用时 <strong>${this.formatTime()}</strong>，再试一次吧。`;
                }
                this.dom.modal.classList.add('open');
            }

            formatTime() {
                const secs = Math.floor(this.timer);
                const cents = Math.floor((this.timer - secs) * 100);
                return `${String(secs).padStart(3, '0')}.${String(cents).padStart(2, '0')}`;
            }

            closeModal() {
                this.dom.modal.classList.remove('open');
            }

            modeName() {
                return this.modes[this.mode].name;
            }

            setupKeyboard() {
                document.addEventListener('keydown', (e) => {
                    if (e.target.tagName === 'INPUT') return;
                    if (e.key === 'r' || e.key === 'R') {
                        this.reset();
                    }
                    if (e.key === 't' || e.key === 'T') {
                        themeBtn.click();
                    }
                    if (e.key === 'Escape') {
                        this.closeModal();
                    }
                });
            }

            preventContextMenu() {
                this.dom.board.addEventListener('contextmenu', e => e.preventDefault());
            }
        }

        const game = new MineSweeper();
    </script>
